<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BizPilot AI - Intelligent business assistant">
  <title>BizPilot AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-top">

        <button class="brand" id="brandBtn">
          <span class="brand-mark">B</span>
          <span>BizPilot</span>
        </button>

        <button class="new-chat" id="newChatBtn">
          <span>＋</span>
          <span>New chat</span>
        </button>

      </div>

      <!-- Chat History -->
      <div class="history">

        <div class="history-label">Recent</div>

        <button class="history-item active">
          Business strategy
        </button>

        <button class="history-item">
          Marketing plan
        </button>

        <button class="history-item">
          Sales analysis
        </button>

      </div>

      <!-- Bottom -->
      <div class="sidebar-bottom">

        <button class="side-link">
          ⚙
          <span>Settings</span>
        </button>

        <button class="profile">
          <span class="avatar">B</span>
          <span class="profile-name">BizPilot User</span>
          <span class="dots">•••</span>
        </button>

      </div>

    </aside>


    <!-- Main Area -->
    <main class="main">

      <!-- Top Bar -->
      <header class="topbar">

        <button
          class="icon-btn mobile-only"
          id="menuBtn"
          aria-label="Open menu">
          ☰
        </button>

        <button class="model-name" id="modelBtn">
          BizPilot AI
          <span>⌄</span>
        </button>

        <button
          class="icon-btn"
          id="newMobileBtn"
          aria-label="New chat">
          ✎
        </button>

      </header>


      <!-- Chat -->
      <section class="chat" id="chat">

        <!-- Welcome -->
        <div class="welcome" id="welcome">

          <div class="welcome-logo">
            B
          </div>

          <h1>
            How can I help you today?
          </h1>

          <p>
            Ask BizPilot about your business, strategy,
            marketing, sales, or operations.
          </p>


          <!-- Suggestions -->
          <div class="suggestions">

            <button class="suggestion">
              Create a business plan
            </button>

            <button class="suggestion">
              Analyze my marketing
            </button>

            <button class="suggestion">
              Build a sales strategy
            </button>

            <button class="suggestion">
              Give me business ideas
            </button>

          </div>

        </div>

      </section>


      <!-- Message Box -->
      <div class="composer-wrap">

        <form class="composer" id="composer">

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message BizPilot AI..."
            autocomplete="off">
          </textarea>

          <button
            class="send"
            type="submit"
            aria-label="Send">
            ↑
          </button>

        </form>

        <div class="disclaimer">
          BizPilot AI can make mistakes.
          Check important business information.
        </div>

      </div>

    </main>

  </div>


  <!-- Mobile Overlay -->
  <div class="overlay" id="overlay"></div>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
